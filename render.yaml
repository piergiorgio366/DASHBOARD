services:
  - type: pserv
    name: gods-eye-view-app-2026
    runtime: docker
    repo: https://github.com/bilawalsidhu/gods-eye-view.git
    branch: main
    region: frankfurt
    plan: standard
    dockerfilePath: ./Dockerfile
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "4173"
      - key: GEV_KEY_SETUP_TRUSTED_PEERS
        value: none
    disk:
      name: gods-eye-view-cache
      mountPath: /app/.gev-cache
      sizeGB: 1
